<svg xmlns="http://www.w3.org/2000/svg" width="580" height="188" viewBox="0 0 580 188" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Core skills</title>
  <desc id="d">Laravel, MySQL, and REST API at advanced level; React and Kotlin at proficient level.</desc>
  <defs>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop class="s1" offset="0"/>
      <stop class="s2" offset="1"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .label { font-size: 14px; font-weight: 600; fill: #24292f; }
      .level { font-size: 12px; font-weight: 500; fill: #57606a; letter-spacing: .02em; }
      .track { fill: #d0d7de; }
      .s1 { stop-color: #4f46e5; }
      .s2 { stop-color: #0e7490; }
      .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-color-scheme: dark) {
        .label { fill: #e6edf3; }
        .level { fill: #8b949e; }
        .track { fill: #30363d; }
        .s1 { stop-color: #818cf8; }
        .s2 { stop-color: #22d3ee; }
      }
      @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
    </style>
  </defs>

  <!-- Laravel -->
  <text class="label" x="0" y="16">Laravel</text>
  <text class="level" x="580" y="16" text-anchor="end">Advanced</text>
  <rect class="track" x="0" y="26" width="580" height="6" rx="3"/>
  <rect class="bar" style="animation-delay:.05s" x="0" y="26" width="522" height="6" rx="3" fill="url(#fill)"/>

  <!-- MySQL -->
  <text class="label" x="0" y="54">MySQL</text>
  <text class="level" x="580" y="54" text-anchor="end">Advanced</text>
  <rect class="track" x="0" y="64" width="580" height="6" rx="3"/>
  <rect class="bar" style="animation-delay:.15s" x="0" y="64" width="493" height="6" rx="3" fill="url(#fill)"/>

  <!-- REST API -->
  <text class="label" x="0" y="92">REST API</text>
  <text class="level" x="580" y="92" text-anchor="end">Advanced</text>
  <rect class="track" x="0" y="102" width="580" height="6" rx="3"/>
  <rect class="bar" style="animation-delay:.25s" x="0" y="102" width="493" height="6" rx="3" fill="url(#fill)"/>

  <!-- React -->
  <text class="label" x="0" y="130">React</text>
  <text class="level" x="580" y="130" text-anchor="end">Advanced</text>
  <rect class="track" x="0" y="140" width="580" height="6" rx="3"/>
  <rect class="bar" style="animation-delay:.35s" x="0" y="140" width="435" height="6" rx="3" fill="url(#fill)"/>

  <!-- Kotlin -->
  <text class="label" x="0" y="168">Kotlin</text>
  <text class="level" x="580" y="168" text-anchor="end">Proficient</text>
  <rect class="track" x="0" y="178" width="580" height="6" rx="3"/>
  <rect class="bar" style="animation-delay:.45s" x="0" y="178" width="406" height="6" rx="3" fill="url(#fill)"/>
</svg>
